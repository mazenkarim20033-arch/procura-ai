[project]
name = "procura-ai-backend"
version = "0.1.0"
description = "Procura AI backend (synthetic-data demo; humans make all decisions)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pgvector>=0.2.5",
  "pymupdf>=1.24",
  "python-multipart>=0.0.9",
  "fastembed>=0.3",
  "httpx>=0.27",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "reportlab>=4"]  # reportlab: synthetic data generator
ocr = ["pytesseract>=0.3", "pillow>=10"]  # also needs the Tesseract binary on PATH

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real DATABASE_URL (skipped otherwise)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]
ignore = ["B008", "C408", "UP046"]  # B008: FastAPI Depends() idiom; C408: dict() ok; UP046: classic Generic is fine
