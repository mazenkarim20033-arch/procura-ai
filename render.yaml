# Render blueprint for the API (free web service). UNTESTED: written from the documentation, never deployed.
# Read docs/DEPLOYMENT.md before using it: a public instance must run with READ_ONLY=true.
services:
  - type: web
    name: procura-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DATABASE_URL        # Supabase session-pooler string; set it in the Render dashboard
        sync: false
      - key: READ_ONLY
        value: "true"
      - key: LLM_PROVIDER
        value: mock
      - key: CORS_ORIGINS        # JSON list: the URL of the deployed frontend
        sync: false
      - key: EMBEDDING_CACHE_DIR
        value: /tmp/fastembed
